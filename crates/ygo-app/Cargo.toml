[package]
name = "ygo-app"
description = "Orchestration métier : initialisation de la base, création de classeurs, import/export. Ne connaît aucun type d'interface (règle R6)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
ygo-core.workspace = true
ygo-db.workspace = true
ygo-sources.workspace = true
ygo-images.workspace = true
tokio.workspace = true
tempfile.workspace = true
rusqlite.workspace = true
csv.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
# Empreinte SHA-256 de l'exécutable téléchargé par la mise à jour. Même
# famille (RustCrypto) que `md-5`, déjà au graphe : licences MIT/Apache-2.0.
sha2 = "0.10"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
zip.workspace = true

[lints]
workspace = true
