# Politique de licences — §3.8 du cahier des charges.
#
# Le projet est sous GNU GPL v3.0. Toute dépendance retenue doit être
# compatible. `cargo deny check licenses` fait échouer la construction sur
# toute licence non listée ici.
#
#     cargo install cargo-deny
#     cargo deny check licenses

[licenses]
# Licences compatibles GPLv3 (permissives ou copyleft faible).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "GPL-3.0",
    "GPL-3.0-or-later",
    # Boost Software License : permissive, compatible GPLv3 (liste FSF).
    # `clipboard-win` et `error-code`, le presse-papiers Windows d'egui.
    "BSL-1.0",
]
confidence-threshold = 0.9

# Les polices embarquées par egui (`epaint_default_fonts`).
#
# OFL-1.1 et Ubuntu-font-1.0 sont des licences de **polices** : libres, mais
# rédigées pour des fichiers de police, pas pour du code. Une police livrée
# avec un programme GPL est un ensemble de deux œuvres, pas une œuvre dérivée
# — c'est la lecture de la FSF pour l'OFL. On les accepte donc pour ce seul
# crate, et nulle part ailleurs : une bibliothèque de code sous ces licences
# ferait toujours échouer la CI.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
